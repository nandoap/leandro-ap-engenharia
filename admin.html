<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Laudos | Leandro AP Engenharia Elétrica AD</title>
<style>
  :root{--azul:#0B2545;--azul2:#13315C;--destaque:#1FA3A3;--cinza:#f2f4f7;--texto:#1d2939;--erro:#b42318;--ok:#067647;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--cinza);color:var(--texto)}
  header{background:var(--azul);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:1.05rem;margin:0}
  main{max-width:960px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  h2{margin:0 0 12px;font-size:1.15rem;color:var(--azul)}
  h3{font-size:1rem;margin:14px 0 8px;color:var(--azul2)}
  label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid #cfd4dc;border-radius:8px;font-size:1rem;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr;gap:4px 14px}
  @media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
  button{background:var(--destaque);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:.95rem;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
  button.sec{background:var(--azul2)}
  button.perigo{background:#b42318}
  button.leve{background:#667085}
  .tabs button{background:#e4e7ec;color:var(--azul)}
  .tabs button.ativa{background:var(--azul);color:#fff}
  .item{border:1px solid #e4e7ec;border-radius:10px;padding:12px;margin-top:10px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
  .rasc{background:#fef0c7;color:#93370d}
  .final{background:#d1fadf;color:var(--ok)}
  .msg{padding:10px;border-radius:8px;margin-top:10px;font-size:.92rem}
  .msg.erro{background:#fee4e2;color:var(--erro)}
  .msg.ok{background:#d1fadf;color:var(--ok)}
  .aviso{font-size:.85rem;color:#667085;margin-top:6px}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
  .fotos img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid #e4e7ec}
  .fotos small{display:block;font-size:.8rem;color:#475467;margin-top:2px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <h1>Leandro AP Engenharia Elétrica AD · Painel de Laudos</h1>
  <button id="btn-sair" class="leve" hidden>Sair</button>
</header>

<main>
  <section id="area-login" class="card">
    <h2>Entrar</h2>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="senha">Senha</label>
      <input id="senha" type="password" required autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
    <div id="login-msg"></div>
  </section>

  <section id="painel" hidden>
    <div class="tabs card">
      <button id="tab-clientes" class="ativa">Clientes</button>
      <button id="tab-inspecoes">Inspeções</button>
    </div>

    <div id="aba-clientes">
      <section class="card">
        <h2>Novo cliente</h2>
        <form id="form-cliente">
          <div class="grid">
            <div><label>Nome</label><input id="c-nome" required></div>
            <div><label>Documento (CPF/CNPJ)</label><input id="c-documento"></div>
            <div><label>Telefone</label><input id="c-telefone"></div>
            <div><label>E-mail</label><input id="c-email" type="email"></div>
            <div><label>Endereço</label><input id="c-endereco"></div>
            <div><label>Tipo de imóvel</label><input id="c-tipo"></div>
          </div>
          <button type="submit">Salvar cliente</button>
        </form>
        <div id="cliente-msg"></div>
      </section>
      <section class="card">
        <h2>Clientes cadastrados</h2>
        <div id="lista-clientes"></div>
      </section>
    </div>

    <div id="aba-inspecoes" hidden>
      <section class="card">
        <h2 id="titulo-form-insp">Nova inspeção</h2>
        <form id="form-inspecao">
          <input type="hidden" id="i-id">
          <div class="grid">
            <div><label>Cliente</label><select id="i-cliente" required></select></div>
            <div><label>Data da vistoria</label><input id="i-data" type="date"></div>
            <div><label>Tipo de laudo</label>
              <select id="i-tipo">
                <option>Laudo elétrico</option>
                <option>SPDA</option>
                <option>Inspeção NR-10</option>
                <option>Termografia</option>
                <option>Medições elétricas</option>
                <option>Consultoria técnica</option>
                <option>Outro</option>
              </select>
            </div>
          </div>

          <h3>Medições (preencha somente o que foi medido)</h3>
          <div class="grid">
            <div><label>Tensão</label><input id="i-m-tensao"></div>
            <div><label>Corrente</label><input id="i-m-corrente"></div>
            <div><label>Aterramento</label><input id="i-m-aterramento"></div>
            <div><label>Isolamento</label><input id="i-m-isolamento"></div>
            <div><label>Instrumento utilizado</label><input id="i-m-instrumento"></div>
          </div>

          <h3>Textos do laudo</h3>
          <label>Objetivo</label><textarea id="i-t-objetivo"></textarea>
          <label>Não conformidades / constatações</label><textarea id="i-t-naoconf"></textarea>
          <label>Conclusão</label><textarea id="i-t-conclusao"></textarea>

          <button type="submit">Salvar inspeção</button>
          <button type="button" id="i-cancelar" class="leve">Limpar formulário</button>
        </form>
        <div id="inspecao-msg"></div>
      </section>

      <section class="card" id="area-fotos" hidden>
        <h2>Fotografias da inspeção selecionada</h2>
        <p class="aviso">Inspeção: <strong id="fotos-titulo"></strong></p>
        <label>Legenda</label>
        <input id="foto-legenda" placeholder="Ex.: Quadro de distribuição">
        <label>Imagem</label>
        <input id="foto-arquivo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
        <button id="btn-enviar-foto">Enviar foto</button>
        <div id="foto-msg"></div>
        <div id="lista-fotos" class="fotos"></div>
      </section>

      <section class="card">
        <h2>Inspeções</h2>
        <div id="lista-inspecoes"></div>
      </section>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://xphlabwpflvlctvyglfv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8xhkHzV4iOjyntIkJCszVg_bUCHEaeE";
  const STORAGE_BUCKET = "laudos-fotos";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const v = id => $(id).value.trim() || null;

  let clientes = [];
  let inspecoes = [];
  let inspecaoAtual = null;

  function esc(x){
    return String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function txt(x){ return x && String(x).trim() ? esc(x) : "Não informado"; }
  function dataBR(d){
    if (!d) return "Não informado";
    const p = String(d).slice(0,10).split("-");
    return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : esc(d);
  }
  function aviso(el, texto, tipo = "ok"){
    el.innerHTML = `<div class="msg ${tipo}">${esc(texto)}</div>`;
  }
  function limpaAviso(el){ el.innerHTML = ""; }
  async function usuarioAtual(){
    const { data: { user } } = await sb.auth.getUser();
    return user;
  }

  /* ---------- LOGIN ---------- */
  async function mostrarPainel(){
    $("area-login").hidden = true;
    $("painel").hidden = false;
    $("btn-sair").hidden = false;
    await carregarClientes();
    await carregarInspecoes();
  }
  function esconderPainel(){
    $("area-login").hidden = false;
    $("painel").hidden = true;
    $("btn-sair").hidden = true;
  }

  $("form-login").addEventListener("submit", async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("senha").value
    });
    if (error) return aviso($("login-msg"), "Não foi possível entrar: " + error.message, "erro");
    $("senha").value = "";
    limpaAviso($("login-msg"));
    mostrarPainel();
  });

  $("btn-sair").addEventListener("click", async () => {
    await sb.auth.signOut();
    location.reload();
  });

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) mostrarPainel(); else esconderPainel();
  })();

  /* ---------- ABAS ---------- */
  function abrirAba(qual){
    const cli = qual === "clientes";
    $("aba-clientes").hidden = !cli;
    $("aba-inspecoes").hidden = cli;
    $("tab-clientes").classList.toggle("ativa", cli);
    $("tab-inspecoes").classList.toggle("ativa", !cli);
  }
  $("tab-clientes").onclick = () => abrirAba("clientes");
  $("tab-inspecoes").onclick = () => abrirAba("inspecoes");

  /* ---------- CLIENTES ---------- */
  async function carregarClientes(){
    const { data, error } = await sb.from("clientes").select("*").order("criado_em", { ascending: false });
    if (error) return aviso($("cliente-msg"), "Erro ao carregar clientes: " + error.message, "erro");
    clientes = data || [];
    $("lista-clientes").innerHTML = clientes.length
      ? clientes.map(c => `
          <div class="item">
            <strong>${esc(c.nome)}</strong><br>
            Telefone: ${txt(c.telefone)} · E-mail: ${txt(c.email)}<br>
            Endereço: ${txt(c.endereco)}
          </div>`).join("")
      : "<p class='aviso'>Nenhum cliente cadastrado.</p>";
    $("i-cliente").innerHTML = clientes.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join("");
  }

  $("form-cliente").addEventListener("submit", async e => {
    e.preventDefault();
    const formulario = e.target;
    const user = await usuarioAtual();
    const { error } = await sb.from("clientes").insert({
      owner_id: user.id,
      nome: v("c-nome"),
      documento: v("c-documento"),
      telefone: v("c-telefone"),
      email: v("c-email"),
      endereco: v("c-endereco"),
      tipo_imovel: v("c-tipo")
    });
    if (error) return aviso($("cliente-msg"), "Erro ao salvar cliente: " + error.message, "erro");
    formulario.reset();
    await carregarClientes();
    aviso($("cliente-msg"), "Cliente salvo.");
  });

  /* ---------- INSPEÇÕES ---------- */
  async function carregarInspecoes(){
    const { data, error } = await sb.from("inspecoes").select("*").order("criado_em", { ascending: false });
    if (error) return aviso($("inspecao-msg"), "Erro ao carregar inspeções: " + error.message, "erro");
    inspecoes = data || [];
    renderInspecoes();
  }

  function nomeCliente(id){
    const c = clientes.find(x => x.id === id);
    return c ? c.nome : "Cliente não encontrado";
  }
  function badge(status){
    return status === "Finalizado"
      ? `<span class="badge final">FINALIZADO</span>`
      : `<span class="badge rasc">RASCUNHO</span>`;
  }

  function renderInspecoes(){
    $("lista-inspecoes").innerHTML = inspecoes.length
      ? inspecoes.map(i => `
          <div class="item">
            <strong>${esc(nomeCliente(i.cliente_id))}</strong> ${badge(i.status)}<br>
            ${esc(i.tipo_laudo || "Tipo não informado")} · ${dataBR(i.data_vistoria)}
            <div>
              <button class="sec" onclick="editarInspecao('${i.id}')">Editar</button>
              <button class="sec" onclick="abrirFotos('${i.id}')">Fotos</button>
              <button class="leve" onclick="gerarRelatorio('${i.id}')">Relatório / PDF</button>
              ${i.status === "Finalizado"
                ? `<button class="leve" onclick="alterarStatus('${i.id}','Rascunho')">Voltar a rascunho</button>`
                : `<button onclick="alterarStatus('${i.id}','Finalizado')">Finalizar laudo</button>`}
            </div>
          </div>`).join("")
      : "<p class='aviso'>Nenhuma inspeção cadastrada.</p>";
  }

  function setVal(id, valor){ $(id).value = valor ?? ""; }

  function editarInspecao(id){
    const i = inspecoes.find(x => x.id === id);
    if (!i) return;
    $("i-id").value = i.id;
    setVal("i-cliente", i.cliente_id);
    setVal("i-data", (i.data_vistoria || "").slice(0,10));
    setVal("i-tipo", i.tipo_laudo);
    setVal("i-m-tensao", i.med_tensao);
    setVal("i-m-corrente", i.med_corrente);
    setVal("i-m-aterramento", i.med_aterramento);
    setVal("i-m-isolamento", i.med_isolamento);
    setVal("i-m-instrumento", i.med_instrumento);
    setVal("i-t-objetivo", i.texto_objetivo);
    setVal("i-t-naoconf", i.texto_naoconf);
    setVal("i-t-conclusao", i.texto_conclusao);
    $("titulo-form-insp").textContent = "Editar inspeção";
    abrirAba("inspecoes");
    abrirFotos(id);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function limparFormInspecao(){
    $("form-inspecao").reset();
    $("i-id").value = "";
    $("titulo-form-insp").textContent = "Nova inspeção";
    limpaAviso($("inspecao-msg"));
  }
  $("i-cancelar").onclick = limparFormInspecao;

  $("form-inspecao").addEventListener("submit", async e => {
    e.preventDefault();
    const id = $("i-id").value;
    const dados = {
      cliente_id: $("i-cliente").value,
      data_vistoria: v("i-data"),
      tipo_laudo: $("i-tipo").value,
      med_tensao: v("i-m-tensao"),
      med_corrente: v("i-m-corrente"),
      med_aterramento: v("i-m-aterramento"),
      med_isolamento: v("i-m-isolamento"),
      med_instrumento: v("i-m-instrumento"),
      texto_objetivo: v("i-t-objetivo"),
      texto_naoconf: v("i-t-naoconf"),
      texto_conclusao: v("i-t-conclusao")
    };

    let res;
    if (id) {
      // Ao editar, o status não é alterado aqui: ele muda só pelo botão Finalizar.
      res = await sb.from("inspecoes").update(dados).eq("id", id).select();
    } else {
      const user = await usuarioAtual();
      res = await sb.from("inspecoes").insert({ ...dados, status: "Rascunho", owner_id: user.id }).select();
    }

    if (res.error) return aviso($("inspecao-msg"), "Erro ao salvar inspeção: " + res.error.message, "erro");
    if (!res.data || !res.data.length) {
      return aviso($("inspecao-msg"), "Nada foi salvo. Verifique se a inspeção pertence a esta conta.", "erro");
    }

    await carregarInspecoes();
    if (!id) {
      limparFormInspecao();
      abrirFotos(res.data[0].id);
    }
    aviso($("inspecao-msg"), "Inspeção salva.");
  });

  /* ---------- FINALIZAR / VOLTAR A RASCUNHO ---------- */
  async function alterarStatus(id, novo){
    const pergunta = novo === "Finalizado"
      ? "Confirma que este laudo foi revisado pelo responsável técnico? O PDF deixará de exibir RASCUNHO."
      : "Voltar este laudo para RASCUNHO?";
    if (!confirm(pergunta)) return;

    const { data, error } = await sb.from("inspecoes").update({ status: novo }).eq("id", id).select();
    if (error || !data || !data.length) {
      return alert("Não foi possível alterar o status. " + (error ? error.message : "Verifique as permissões."));
    }
    await carregarInspecoes();
    alert("Status alterado para " + novo + ".");
  }

  /* ---------- FOTOS ---------- */
  async function abrirFotos(id){
    inspecaoAtual = id;
    const i = inspecoes.find(x => x.id === id);
    $("fotos-titulo").textContent = i ? `${nomeCliente(i.cliente_id)} · ${dataBR(i.data_vistoria)}` : id;
    $("area-fotos").hidden = false;
    limpaAviso($("foto-msg"));
    await listarFotos();
  }

  async function urlFoto(caminho){
    if (!caminho) return "";
    if (/^https?:\/\//.test(caminho)) return caminho;
    const { data, error } = await sb.storage.from(STORAGE_BUCKET).createSignedUrl(caminho, 3600);
    return error ? "" : data.signedUrl;
  }

  async function listarFotos(){
    const { data, error } = await sb.from("fotos").select("*").eq("inspecao_id", inspecaoAtual).order("criado_em");
    if (error) return aviso($("foto-msg"), "Erro ao carregar fotos: " + error.message, "erro");
    const lista = data || [];
    if (!lista.length) {
      $("lista-fotos").innerHTML = "<p class='aviso'>Nenhuma foto nesta inspeção.</p>";
      return;
    }
    const urls = await Promise.all(lista.map(f => urlFoto(f.url)));
    $("lista-fotos").innerHTML = lista.map((f, n) => `
      <div>
        ${urls[n] ? `<img src="${urls[n]}" alt="${esc(f.legenda || "Foto")}">` : "<p class='aviso'>Imagem indisponível</p>"}
        <small>${txt(f.legenda)}</small>
        <button class="perigo" onclick="excluirFoto('${f.id}','${esc(f.url)}')">Excluir</button>
      </div>`).join("");
  }

  async function excluirFoto(id, caminho){
    if (!confirm("Excluir esta foto do laudo?")) return;
    if (caminho && !/^https?:\/\//.test(caminho)) {
      await sb.storage.from(STORAGE_BUCKET).remove([caminho]);
    }
    const { error } = await sb.from("fotos").delete().eq("id", id);
    if (error) return aviso($("foto-msg"), "Erro ao excluir foto: " + error.message, "erro");
    listarFotos();
  }

  $("btn-enviar-foto").onclick = async () => {
    if (!inspecaoAtual) return aviso($("foto-msg"), "Selecione uma inspeção primeiro.", "erro");
    const arquivo = $("foto-arquivo").files[0];
    if (!arquivo) return aviso($("foto-msg"), "Escolha uma imagem.", "erro");
    if (arquivo.size > 10 * 1024 * 1024) return aviso($("foto-msg"), "A imagem passa de 10 MB.", "erro");

    aviso($("foto-msg"), "Enviando...");
    const user = await usuarioAtual();
    const ext = (arquivo.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    const caminho = `${user.id}/${inspecaoAtual}/${Date.now()}.${ext}`;

    const up = await sb.storage.from(STORAGE_BUCKET).upload(caminho, arquivo, {
      contentType: arquivo.type,
      upsert: false
    });
    if (up.error) return aviso($("foto-msg"), "Erro ao enviar a imagem: " + up.error.message, "erro");

    const { error } = await sb.from("fotos").insert({
      inspecao_id: inspecaoAtual,
      url: caminho,
      legenda: v("foto-legenda"),
      owner_id: user.id
    });
    if (error) return aviso($("foto-msg"), "Erro ao registrar a foto: " + error.message, "erro");

    $("foto-arquivo").value = "";
    $("foto-legenda").value = "";
    await listarFotos();
    aviso($("foto-msg"), "Foto enviada.");
  };

  /* ---------- RELATÓRIO ---------- */
  async function gerarRelatorio(id){
    const { data: i, error } = await sb.from("inspecoes").select("*").eq("id", id).single();
    if (error) return alert("Erro ao buscar a inspeção: " + error.message);

    const cliente = clientes.find(c => c.id === i.cliente_id) || {};
    const { data: fotos } = await sb.from("fotos").select("*").eq("inspecao_id", id).order("criado_em");
    const lista = fotos || [];
    const urls = await Promise.all(lista.map(f => urlFoto(f.url)));
    const rascunho = i.status !== "Finalizado";

    const identificacao = [
      ["Cliente", cliente.nome],
      ["Documento", cliente.documento],
      ["Endereço", cliente.endereco],
      ["Tipo de imóvel", cliente.tipo_imovel],
      ["Tipo de laudo", i.tipo_laudo],
      ["Data da vistoria", dataBR(i.data_vistoria)]
    ];
    const medicoes = [
      ["Tensão", i.med_tensao],
      ["Corrente", i.med_corrente],
      ["Aterramento", i.med_aterramento],
      ["Isolamento", i.med_isolamento],
      ["Instrumento", i.med_instrumento]
    ];

    const html = `<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório - ${esc(cliente.nome || "")}</title>
<style>
  body{font-family:Arial,sans-serif;color:#1d2939;max-width:820px;margin:0 auto;padding:20px;font-size:14px}
  header{border-bottom:3px solid #0B2545;padding-bottom:10px;margin-bottom:14px}
  h1{font-size:18px;color:#0B2545;margin:0}
  h2{font-size:15px;color:#0B2545;border-bottom:1px solid #d0d5dd;padding-bottom:4px;margin-top:20px}
  table{width:100%;border-collapse:collapse}
  td{border:1px solid #d0d5dd;padding:6px;vertical-align:top}
  td.r{width:32%;background:#f2f4f7;font-weight:bold}
  .status{font-weight:bold;padding:8px 10px;margin:10px 0;text-align:center;border:2px solid}
  .rasc{color:#93370d;border-color:#93370d;background:#fef0c7}
  .final{color:#067647;border-color:#067647;background:#d1fadf}
  .fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fotos img{width:100%;border:1px solid #d0d5dd}
